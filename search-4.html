<!DOCTYPE html>
<html lang="en">
    <style>
        *{
            background-color: blue;
            color: black;
        }

        body {
            border-radius: 10px;
            border: 2px solid black;
            color: black;
            background-color: white;
        }

        li {
            color: black;
            background-color: white;
        }

        input {
            background-color: purple;
            width: 100px;
            height: 50px;
        }
    </style>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input oninput="searchfunction()" type="text" name="" id="searchbox">
    <ul id="list"></ul>
</body>
<script>
    const foods = ["momo", "pani puri", "chatpate", "samosa", "spaghetti"]

    function searchfunction() {
        const searchterm = document.getElementById("searchbox").value
        const search = foods.filter((items) => (items.includes(searchterm)))
        console.log(search)
        displaylist(search)
    }

    function displaylist(dishlist) {
        const ul = document.getElementById("list")
        ul.innerHTML = dishlist.map((items) => (`<li>${items}</li>`))
    }
    displaylist(foods)
    searchfunction()
</script>

</html>
