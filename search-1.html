<!DOCTYPE html>
<html lang="en">
    <style>
        *{
            border: 2px solid black;
            width: 600px;
            gap: 20px;
            padding: 10px;
        }
    </style>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <input oninput="searchfunction()" type="text" name="" id="searchbox">
    <ul id="list"></ul>
</body>
<script>
    const world = ["earth", "moon", "mars", "jupiter", "universe"]

    function searchfunction() {
        const searchterm = document.getElementById("searchbox").value
        const search = world.filter((items) => (items.includes(searchterm)))
        console.log(search)
        displaylist(search)
    }

    function displaylist(dishlist) {
        const ul = document.getElementById("list")
        ul.innerHTML = dishlist.map((items) => (`<li>${items}</li>`))
    }
    displaylist(world)
    searchfunction()
</script>

</html>
